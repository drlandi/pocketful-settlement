[project]
name = "band-seats"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel Landi", email = "drlandi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "band-sdk[anthropic]>=3.2.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
band-seats = "band_seats:main"
planner = "band_seats.planner:main"
executor = "band_seats.executor:main"
reconciler = "band_seats.reconciler:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
